<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASH AL — Admin Control Center</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-white min-h-screen"><main class="max-w-7xl mx-auto p-4 md:p-7"><div id="login" class="min-h-[90vh] flex items-center justify-center"><form onsubmit="login(event)" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-[2rem] p-8"><div class="text-indigo-400 font-black text-2xl">CASH AL</div><h1 class="text-3xl font-black mt-3">مركز التحكم</h1><p class="text-slate-400 mt-2">بوابة Super Admin آمنة</p><input id="pw" type="password" required class="w-full mt-7 p-4 rounded-xl text-slate-900" placeholder="كلمة مرور الأدمن"><button class="w-full mt-3 p-4 rounded-xl bg-indigo-600 font-bold">دخول آمن</button></form></div><div id="panel" class="hidden"><header class="flex flex-wrap justify-between items-center gap-4"><div><div class="text-indigo-400 font-black">CASH AL / CONTROL CENTER</div><h1 class="text-3xl font-black mt-1">لوحة الإدارة العليا</h1><p id="who" class="text-slate-400 mt-1"></p></div><button onclick="logout()" class="px-4 py-2 rounded-xl border border-slate-700">تسجيل الخروج</button></header><div id="stats" class="grid md:grid-cols-3 gap-4 mt-7"></div><div class="grid xl:grid-cols-3 gap-5 mt-6"><section class="bg-slate-900 border border-slate-800 rounded-3xl p-6"><h2 class="font-black text-xl">تعديل رصيد عبر ID</h2><p class="text-xs text-slate-400 mt-2">القيمة الموجبة إضافة، والسالبة خصم. كل تعديل يسجل في Ledger وAudit Log.</p><form onsubmit="balance(event)" class="space-y-3 mt-5"><input id="pid" required class="w-full p-3 rounded-xl text-slate-900" placeholder="CAL-..."><select id="wt" class="w-full p-3 rounded-xl text-slate-900"><option value="safe">المحفظة الآمنة</option><option value="smart">المحفظة الذكية</option></select><select id="cur" class="w-full p-3 rounded-xl text-slate-900"><option>USD</option><option>SYP</option><option>EUR</option><option>USDT</option></select><input id="amt" type="number" step="any" required class="w-full p-3 rounded-xl text-slate-900" placeholder="المبلغ"><input id="note" required class="w-full p-3 rounded-xl text-slate-900" placeholder="سبب العملية"><button class="w-full p-3 rounded-xl bg-indigo-600 font-bold">تنفيذ</button></form></section><section class="xl:col-span-2 bg-slate-900 border border-slate-800 rounded-3xl p-6"><div class="flex justify-between items-center"><h2 class="font-black text-xl">المعاملات</h2><button onclick="loadAll()" class="px-3 py-2 border border-slate-700 rounded-xl">تحديث</button></div><div id="tx" class="space-y-3 mt-5"></div></section></div><div class="grid xl:grid-cols-2 gap-5 mt-5"><section class="bg-slate-900 border border-slate-800 rounded-3xl p-6"><h2 class="font-black text-xl">المستخدمون</h2><div id="users" class="space-y-2 mt-4"></div></section><section class="bg-slate-900 border border-slate-800 rounded-3xl p-6"><h2 class="font-black text-xl">طلبات التوثيق</h2><div id="kyc" class="space-y-2 mt-4"></div></section></div></div></main><script>let csrfToken='';const $=s=>document.querySelector(s);function getCookie(n){const x=document.cookie.split('; ').find(v=>v.startsWith(n+'='));return x?decodeURIComponent(x.split('=').slice(1).join('=')):''}async function api(u,o={}){o.credentials='same-origin';o.headers={...(o.headers||{})};if(['POST','PUT','PATCH','DELETE'].includes(o.method||'GET'))o.headers['x-cashal-csrf']=csrfToken||getCookie('cashal_csrf')||'';if(o.body&&typeof o.body!=='string'){o.headers['content-type']='application/json';o.body=JSON.stringify(o.body)}const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطأ');return d}async function login(e){e.preventDefault();try{const d=await api('/api/auth/admin-login',{method:'POST',body:{password:$('#pw').value}});csrfToken=d.csrf;$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');loadAll()}catch(x){alert(x.message)}}async function loadAll(){try{const [s,t,u,k]=await Promise.all([api('/api/admin/stats'),api('/api/admin/transactions'),api('/api/admin/users'),api('/api/admin/kyc')]);$('#stats').innerHTML=[['المستخدمون',s.users],['عمليات معلقة',s.pendingTransactions],['توثيق معلق',s.pendingKyc]].map(x=>`<div class="bg-slate-900 border border-slate-800 rounded-3xl p-5"><small class="text-slate-400">${x[0]}</small><div class="text-3xl font-black mt-2">${x[1]}</div></div>`).join('');$('#tx').innerHTML=t.map(x=>`<div class="border border-slate-800 rounded-2xl p-4"><div class="flex flex-wrap justify-between gap-2"><b>#${x.id} • ${x.public_id}</b><span>${x.status}</span></div><div class="text-sm text-slate-300 mt-2">${x.full_name} • ${x.type} • ${x.amount} ${x.currency} • ${x.wallet_type||''}</div>${x.status==='pending'?`<div class="flex gap-2 mt-3"><button onclick="decision(${x.id},'approve')" class="px-3 py-2 rounded-xl bg-emerald-600">اعتماد</button><button onclick="decision(${x.id},'reject')" class="px-3 py-2 rounded-xl bg-red-600">رفض</button></div>`:''}</div>`).join('')||'لا توجد معاملات';$('#users').innerHTML=u.map(x=>`<div class="border border-slate-800 rounded-xl p-3"><b>${x.public_id}</b> — ${x.full_name}<div class="text-xs text-slate-400">${x.email||x.phone||'—'} • KYC: ${x.kyc_status}</div></div>`).join('')||'لا يوجد مستخدمون';$('#kyc').innerHTML=k.map(x=>`<div class="border border-slate-800 rounded-xl p-3"><b>#${x.id} • ${x.public_id}</b><div class="text-sm mt-1">${x.full_name} • ${x.status}</div>${x.status==='pending'?`<div class="flex gap-2 mt-2"><button onclick="kycDecision(${x.id},'verified')" class="px-3 py-2 rounded-xl bg-emerald-600">توثيق</button><button onclick="kycDecision(${x.id},'rejected')" class="px-3 py-2 rounded-xl bg-red-600">رفض</button></div>`:''}</div>`).join('')||'لا توجد طلبات'}catch(e){alert(e.message)}}async function decision(id,a){try{await api('/api/admin/transactions/'+id+'/'+a,{method:'POST'});loadAll()}catch(e){alert(e.message)}}async function balance(e){e.preventDefault();try{const d=await api('/api/admin/balance',{method:'POST',body:{publicId:$('#pid').value.trim(),walletType:$('#wt').value,currency:$('#cur').value,amount:+$('#amt').value,note:$('#note').value.trim()}});alert(`تم تحديث الرصيد: ${d.before} → ${d.after}`);loadAll()}catch(x){alert(x.message)}}async function kycDecision(id,status){try{await api('/api/admin/kyc/'+id+'/decision',{method:'POST',body:{status}});loadAll()}catch(e){alert(e.message)}}async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch(e){}location.reload()}</script></body></html>
